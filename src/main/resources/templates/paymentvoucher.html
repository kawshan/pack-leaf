<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Voucher</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/paymentvoucher.js"></script>

    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->

</head>
<body>
<div class="container-fluid">

    <!--title area start-->
    <div class="row p-4" style="background-color: #54C392">
        <h1 class="text-center">Payment Voucher</h1>
    </div>
    <!--title area start-->


    <!--button row start-->
    <div class="row mt-1 mb-1">


        <div class="col-md-3">
            <div id="divModifyButton" class="d-none">
                <div class="col-md-12">
                    <button type="button" class="btn btn-warning fw-bold"
                            style="width: 25%; color: whitesmoke; border: 1px solid black;"
                            onclick="refillPaymentVoucherHeader(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-recycle fa-beat"></i> Refill
                    </button>
                    <button type="button" class="btn btn-danger fw-bold"
                            style=" width: 25%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                            onclick="deletePaymentVoucherHeader(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-trash fa-beat"></i> Delete
                    </button>
                    <button onclick="printGrnHeader(window['editOb'],window['editRow'])" type="button"
                            class="btn btn-primary fw-bold"
                            style=" width: 25%; color: whitesmoke;border: 1px solid black">
                        <i class="fa-solid fa-eye fa-beat"></i> Print
                    </button>
                </div>
            </div>
        </div>



        <div class="col-md-3"></div>
        <div class="col-md-3"></div>


        <div class="col-md-3">
            <button type="button" style="width: 20%; height: 40px" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Search</button>
        </div>


    </div>
    <!--button row end-->



    <!--header form area start-->
    <div class="card">
        <form onsubmit="return false">


            <!--button row start-->
            <div class="row mt-1">
                <div class="col-md-3"></div>
                <div class="col-md-3"></div>
                <div class="col-md-3">
                    <button type="button" class="btn btn-danger">reset</button>
                    <button type="button" class="btn btn-success" onclick="savePaymentVoucherHeader()">Submit</button>
                </div>
                <div class="col-md-3"></div>
            </div>
            <!--button row start-->


            <div class="row">
                <div class="col-md-3">
                    <label for="selectSupplier" class="form-label fw-bold"> Supplier Name <i class="text-danger">*</i>
                    </label>
                    <select id="selectSupplier" class="form-select text-start" onchange="selectDBValidator(this,'','paymentVoucherHeader','supplier_id')">
                        <option></option>
                    </select>
                </div>



                <div class="col-md-3">
                    <label for="selectPaymentMode" class="form-label fw-bold"> Payment Mode <i class="text-danger">*</i>
                    </label>
                    <select id="selectPaymentMode" class="form-select text-start" required onchange="selectValidator(this,'','paymentVoucherHeader','payment_mode'); handleShortNameAndAccountNumber(this)">
                        <option value="" selected disabled>Select an Option</option>
                        <option value="cash">Cash</option>
                        <option value="cheque">Cheque</option>
                    </select>

                </div>



                <div class="col-md-3">
                    <label for="displayPaymentVoucherCode" class="form-label fw-bold">Payment Voucher Code</label>
                    <input type="text" id="displayPaymentVoucherCode" class="form-control text-center" disabled>
                </div>


                <div class="col-md-3" style="margin-top: 25px">

                    <table class="table table-bordered table-striped">
                        <tbody>

                        <!--                first row-->
                        <tr>
                            <td>
                                <label for="textPaymentVoucherNo" class="form-label fw-bold"> Payment Voucher NO &nbsp; <i class="text-danger">*</i> </label>
                            </td>
                            <td>
                                <input type="text" id="textPaymentVoucherNo" class="form-control text-start"
                                       placeholder="Enter Payment Voucher NO" onkeyup="textValidator(this,'','paymentVoucherHeader','payment_voucher_number')">
                            </td>
                        </tr>
                        <!--                first row-->


                        <!--                second row-->
                        <tr>
                            <td>
                                <label for="textPaymentVoucherDate" class="form-label fw-bold">Payment Voucher Date <i class="text-danger">*</i> </label>
                            </td>
                            <td>
                                <input type="date" id="textPaymentVoucherDate" class="form-control" onchange="textValidator(this,'','paymentVoucherHeader','payment_voucher_date')">
                            </td>
                        </tr>
                        <!--                second row-->


                        <!--                third row-->
                        <tr>
                            <td>
                                <label for="textGrnNo" class="form-label fw-bold">GRN NO <i class="text-danger">*</i> </label>
                            </td>
                            <td>
                                <input type="text" id="textGrnNo" class="form-control text-start" placeholder="Enter Grn Number" onchange="textValidator(this,'','paymentVoucherHeader','payment_grn_numbers')">
                            </td>
                        </tr>
                        <!--                third row-->


                        <!--                forth row-->
                        <tr id="trBankShortName">
                            <td>
                                <label for="selectBankShortName" class="form-label fw-bold">Bank Short Name<i class="text-danger">*</i> </label>
                            </td>
                            <td>
                                <select id="selectBankShortName" class="form-select text-start" onchange="selectDBValidator(this,'','paymentVoucherHeader','ownbankaccount_id')"></select>
                            </td>
                        </tr>
                        <!--                forth row-->



                        <!--                fifth row-->
                        <tr id="trChequeNumber">
                            <td>
                                <label for="textChequeNumber" class="form-label fw-bold">Cheque No <i class="text-danger">*</i> </label>
                            </td>
                            <td>
                                <input type="text" id="textChequeNumber" class="form-control text-start" placeholder="Enter Cheque Number" onchange="textValidator(this,'','paymentVoucherHeader','cheque_number')">
                            </td>
                        </tr>
                        <!--                fifth row-->


                        </tbody>
                    </table>
                </div>

            </div>


        </form>
    </div>
    <!--header form area end-->



    <!--detail form area start-->
    <form onsubmit="return false">
        <table class="table table-responsive-lg">
            <tbody>
            <tr>
                <td>
                    <label for="textCode" class="form-label fw-bold">Code</label>
                    <input type="text" id="textCode" class="form-control" placeholder="Enter Code">
                </td>


                <td>
                    <label for="txtDescription" class="form-label fw-bold">Description</label>
                    <input type="text" id="txtDescription" class="form-control" placeholder="Enter Description">
                </td>


                <td>
                    <label for="txtQty" class="form-label fw-bold">Qty</label>
                    <input type="text" id="txtQty" class="form-control" placeholder="Enter Quantity">
                </td>

                <td>
                    <label for="txtRate" class="form-label fw-bold">Rate</label>
                    <input type="text" id="txtRate" class="form-control" placeholder="Enter Rate">
                </td>

                <td>
                    <label for="txtAmount" class="form-label fw-bold">Amount</label>
                    <input type="text" id="txtAmount" class="form-control" placeholder="Enter Amount">
                </td>

                <td>
                    <button type="button" id="buttonPaymentDetailsUpdate" class="btn btn-warning" style="width: 100px; height: 70px">Update</button>
                    <button type="button" id="buttonPaymentDetailsAdd" class="btn btn-success" style="width: 100px; height: 70px">Add</button>
                </td>




            </tr>
            </tbody>
        </table>
    </form>
    <!--detail form area start-->



    <!--   payment Voucher Print model area start -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Payment Voucher Search</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <!--Table payment voucher Header Start-->
                    <div class="card m-4">
                        <table class="table table-hover table-striped"  id="paymentVoucherHeaderTable">
                            <thead>
                            <th>#</th>
                            <th>Supplier Name</th>
                            <th>Payment Code</th>
                            <th>Voucher No</th>
                            <th>Voucher Date</th>
                            <th>GRN No</th>
                            <th>Action</th>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!--Table payment voucher Header Start-->
                </div>
            </div>
        </div>
    </div>
    <!--   payment Voucher Print model area start -->


</div>
</body>
</html>
