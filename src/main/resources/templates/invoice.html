<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/invoice.js"></script>


    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->


</head>
<body>


<!--header area start-->
<div class="row p-4" style="background-color: #F5EFFF">
    <h1 class="text-center">Invoice Master</h1>
</div>
<!--header area start-->


<!--form area start-->
<div class="card">
    <form onsubmit="return false">


        <!--button row start-->
        <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
            <div class="col-md-3">
                <button type="reset" class="btn btn-danger">reset</button>
                <button type="button" class="btn btn-warning">Update</button>
                <button type="reset" class="btn btn-success">Submit</button>
            </div>
            <div class="col-md-3"></div>
        </div>
        <!--button row start-->


        <div class="row">
            <h1 class="h2">Invoice</h1>
            <div class="col-md-3">
                <label for="selectCustomer" class="form-label fw-bold"> Customer Name <i class="text-danger">*</i>
                </label>
                <select id="selectCustomer" class="form-select text-start" onchange="getCustomerValues(this)">
                    <option></option>
                </select>
                <p class="mt-2" id="txtSelectedCustomerAddress" style="padding-left: 20px"></p>
                <p class="mt-2" id="txtSelectedCustomerPhoneNO" style="padding-left: 20px"></p>
            </div>
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
            <div class="col-md-3">

                <table class="table table-bordered table-striped">
                    <tbody>

                    <!--                first row-->
                    <tr>
                        <td>
                            <label for="textInvoiceNO" class="form-label fw-bold"> Invoice Number <i
                                    class="text-danger">*</i> </label>
                        </td>
                        <td>
                            <input type="text" id="textInvoiceNO" class="form-control text-start"
                                   placeholder="Enter Invoice Number">
                        </td>
                    </tr>
                    <!--                first row-->


                    <!--                second row-->
                    <tr>
                        <td>
                            <label for="textInvoiceDate" class="form-label fw-bold">Invoice Date <i class="text-danger">*</i> </label>

                        </td>
                        <td>
                            <input type="date" id="textInvoiceDate" class="form-control" placeholder="Enter Invoice Date">
                        </td>
                    </tr>
                    <!--                second row-->


                    <!--                third row-->
                    <tr>
                        <td>
                            <label for="textPoKey" class="form-label fw-bold"> PO key <i class="text-danger">*</i> </label>
                        </td>
                        <td>
                            <input type="text" id="textPoKey" class="form-control text-start" placeholder="Enter PO Key">                        </td>
                    </tr>
                    <!--                third row-->


                    <!--                forth row-->
                    <tr>
                        <td>
                            <label for="textDispatchKey" class="form-label fw-bold">Dispatch Key <i class="text-danger">*</i></label>
                        </td>
                        <td>
                            <input type="text" id="textDispatchKey" class="form-control" placeholder="enter dispatch key">                    </tr>
                    <!--                forth row-->


                    </tbody>
                </table>
            </div>

        </div>


    </form>
</div>
<!--form area end-->


<!--table item form area start-->
<form onsubmit="return false">
<table class="table">
    <tbody>
        <tr>
            <td>
                <label for="selectItemName" class="form-label fw-bold">Item name</label>
                <select id="selectItemName" class="form-select" onchange="selectDBValidator(this,'','invoiceDetail','item_id'); console.log(this.value)"></select>
            </td>


            <td>
                <label for="txtQty" class="form-label fw-bold">Item Qty</label>
                <input type="text" id="txtQty" class="form-control text-end" placeholder="enter item name" onkeyup="textValidator(this,'','invoiceDetail','invqty')">
            </td>


            <td>
                <label for="txtRate" class="form-label fw-bold">Item Rate</label>
                <input type="text" id="txtRate" class="form-control text-end" placeholder="enter item name" onkeyup="textValidator(this,'','invoiceDetail','invrate'); generateItemValue(this)">
            </td>


            <td>
                <label for="txtValue" class="form-label fw-bold">Item Value</label>
                <input type="text" id="txtValue" class="form-control text-end" placeholder="Value Will Be Auto Generated">
            </td>


            <td>
                <button type="submit" class="btn btn-warning" id="buttonUpdateInvoiceDetail" onclick="updateInvoiceDetail()" style="width: 100px; height: 70px; pointer-events: all">Update</button>
                <button type="submit" class="btn btn-success" id="buttonAddInvoiceDetail" onclick="buttonInvoiceDetailsAdd()" style="width: 100px; height: 70px; pointer-events: all ">Add</button>
            </td>




        </tr>
    </tbody>
</table>
</form>
<!--table item form area start-->


<!--    edit delete print button start-->
<div class="row mt-2">
    <div id="divModifyButton" class="d-none">
        <div class="col-md-6">
            <button type="button" class="btn btn-warning fw-bold"
                    style="width: 10%; color: whitesmoke; border: 1px solid black;"
                    onclick="refillInvoiceDetails(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-recycle fa-beat"></i> Edit
            </button>
            <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                    style=" width: 10%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                    onclick="deleteInvoiceDetail(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-trash fa-beat"></i> Delete
            </button>
            <button onclick="printStudent(window['editOb'],window['editRow'])" type="button"
                    class="btn btn-primary fw-bold"
                    style=" width: 10%; color: whitesmoke;border: 1px solid black">
                <i class="fa-solid fa-eye fa-beat"></i> Print
            </button>
        </div>
    </div>
</div>
<!--    edit delete print button end-->

<!--table area start-->
<div class="card mt-5 p-5">
    <table class="table table-hover table-striped" id="tableInvoiceDetails">

        <thead>
        <th>#</th>
        <th>item name</th>
        <th>Qty</th>
        <th>rate</th>
        <th>value</th>
        <th>Action</th>
        </thead>

        <tbody>
        </tbody>

    </table>
</div>
<!--table area end-->


</body>
</html>
