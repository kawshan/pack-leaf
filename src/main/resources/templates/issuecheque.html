<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <title>Issue Cheque</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/issuecheque.js"></script>

    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->

    <!--    num to words js library-->
    <script src="https://cdn.jsdelivr.net/npm/number-to-words"></script>



</head>

<body>
<div class="container-fluid">


    <!--header area start-->
    <div class="row p-4" style="background-color: #54C392;">
        <h1 class="text-center">Issue Cheque</h1>
    </div>
    <!--header area start-->


    <!--    edit delete print button start-->
    <div class="row mt-2">
        <div id="divModifyButton" class="d-none">
            <div class="col-md-6">
                <button type="button" class="btn btn-warning fw-bold"
                        style="width: 15%; color: whitesmoke; border: 1px solid black;"
                        onclick="refillIssueCheque(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-recycle fa-beat"></i> Refill
                </button>
                <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                        style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                        onclick="deleteIssueCheque(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-trash fa-beat"></i> Delete
                </button>
                <button onclick="printOneIssueCheque(window['editOb'],window['editRow'])" type="button"
                        class="btn btn-primary fw-bold"
                        style=" width: 15%; color: whitesmoke;border: 1px solid black">
                    <i class="fa-solid fa-eye fa-beat"></i> Print
                </button>
            </div>
        </div>
    </div>
    <!--    edit delete print button end-->


<!--    form area start   -->
    <div class="card m-5 p-5">
        <form onsubmit="return false">

            <div class="row mt-5">
                <div class="col-md-3">
                    <label for="textDate" class="form-label fw-bold">Issue Date <i class="text-danger">*</i> </label>
                    <input type="date" id="textDate" class="form-control text-start" onchange="textValidator(this,'','issueCheque','issue_cheque_date')">
                </div>

                <div class="col-md-3">
                    <label for="textChequeDate" class="form-label fw-bold">Cheque Date <i class="text-danger">*</i> </label>
                    <input type="date" id="textChequeDate" class="form-control text-start" onchange="textValidator(this,'','issueCheque','cheque_date')">
                </div>


                <div class="col-md-3">
                    <label for="selectFromAcc" class="form-label fw-bold">From Acc <i class="text-danger">*</i> </label>
                    <select class="form-select text-center" id="selectFromAcc" onchange="selectDBValidator(this,'','issueCheque','ownbankaccount_id');"></select>
                </div>

                <div class="col-md-3">
                    <label for="textChequeNo" class="form-label fw-bold">Cheque No <i class="text-danger">*</i> </label>
                    <input type="text" id="textChequeNo" class="form-control text-start" placeholder="Enter Cheque No" onkeyup="textValidator(this,'^[0-9]{6}$','issueCheque','cheque_number')">
                </div>


            </div>


            <div class="row mt-5">
                <div class="col-md-3">

                    <label for="textAmount" class="form-label fw-bold">Amount <i class="text-danger">*</i> </label>
                    <input type="text" id="textAmount" class="form-control text-start" placeholder="Enter Amount" onkeyup="textValidator(this,'','issueCheque','cheque_amount')">
                </div>
                <div class="col-md-3">
                    <label for="textDescription" class="form-label fw-bold">Description</label>
                    <input type="text" id="textDescription" class="form-control text-start" placeholder="Enter Description" onkeyup="textValidator(this,'','issueCheque','description')">
                </div>
                <div class="col-md-3">
                    <label for="selectIssueChequeStatus" class="form-label fw-bold">Status <i class="text-danger">*</i> </label>
                    <select id="selectIssueChequeStatus" class="form-select text-center" onchange="selectDBValidator(this,'','issueCheque','issuechequestatus_id')"></select>
                </div>
                <div class="col-md-3"></div>
            </div>


            <div class="row mt-5">
                <div class="col-md-4 text-start">
                    <button type="button" class="btn btn-danger" onclick="refreshIssueChequeForm()">Reset</button>
                </div>
                <div class="col-md-4 text-center">
                    <button type="button" id="buttonIssueChequeUpdate" style="pointer-events: all" class="btn btn-warning" onclick="updateIssueCheque()">Update</button>
                </div>
                <div class="col-md-4 text-end">
                    <button type="button" id="buttonIssueChequeAdd" style="pointer-events: all" class="btn btn-primary" onclick="saveIssueCheque()">Submit</button>
                </div>
            </div>


        </form>
    </div>
<!--    form area start   -->

    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4"></div>
        <div class="col-md-4 text-center">
            <button type="button" class="btn btn-primary" onclick="printFullTable()">Print Full Table</button>
        </div>
    </div>


<!--  table area start  -->
    <div class="card m-5 p-5">
        <table class="table table-bordered" style="font-size: 12px" id="issueChequeTable">
            <thead class="text-center">
                <th>#</th>
                <th>Issue Date</th>
                <th>Cheque Date</th>
                <th>From Acc</th>
                <th>Cheque No</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
            </thead>

            <tbody></tbody>

        </table>
    </div>
<!--  table area end  -->



<!--tale area for print-->
    <div class="card m-5 p-5 d-none">
        <table class="table table-bordered" style="font-size: 12px" id="issueChequeTablePrint">
            <thead class="text-center">
            <th>#</th>
            <th>Issue Date</th>
            <th>Cheque Date</th>
            <th>From Acc</th>
            <th>Cheque No</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Status</th>
            </thead>

            <tbody></tbody>

        </table>
    </div>
<!--tale area for print    -->


</div>
</body>
</html>
