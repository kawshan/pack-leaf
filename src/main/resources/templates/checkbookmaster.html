<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>check book master</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/chequebookmaster.js"></script>

    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->


</head>
<body>
<div class="container-fluid">

<!--header area start-->
<div class="row p-4" style="background-color: #54C392;">
    <h1 class="text-center">Cheque Book Master</h1>
</div>
<!--header area start-->


    <!--    edit delete print button start-->
    <div class="row mt-2">
        <div id="divModifyButton" class="d-none">
            <div class="col-md-6">
                <button type="button" class="btn btn-warning fw-bold"
                        style="width: 15%; color: whitesmoke; border: 1px solid black;"
                        onclick="refillChequeBookMaster(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-recycle fa-beat"></i> Refill
                </button>
                <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                        style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                        onclick="deleteCheckBookMaster(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-trash fa-beat"></i> Delete
                </button>
                <button onclick="printOneChequeBook(window['editOb'],window['editRow'])" type="button"
                        class="btn btn-primary fw-bold"
                        style=" width: 15%; color: whitesmoke;border: 1px solid black">
                    <i class="fa-solid fa-eye fa-beat"></i> Print
                </button>
            </div>
        </div>
    </div>
    <!--    edit delete print button end-->


<!--   form area start    -->
<div class="card m-5 p-5">
    <form onsubmit="return false">

<!--     first row start         -->
        <div class="row mt-5">
            <div class="col-md-3">
                <label for="selectBankShortName" class="form-label fw-bold">Bank Short Name <i class="text-danger">*</i>  </label>
                <select id="selectBankShortName" class="form-select text-start" onchange="selectDBValidator(this,'','chequeBookMaster','ownbankaccount_id')"></select>

            </div>
            <div class="col-md-3">
                <label for="textRunningNumber" class="form-label fw-bold">Running Number <i class="text-danger">*</i> </label>
                <input type="text" id="textRunningNumber" disabled class="form-control text-start" onkeyup="textValidator(this,'','chequeBookMaster','running_number')">

            </div>
            <div class="col-md-3">
                <label for="textNumberOfChecks" class="form-label fw-bold">Number Of Cheque <i class="text-danger">*</i> </label>
                <input type="text" id="textNumberOfChecks" class="form-control text-start" placeholder="Enter Number Of Cheques" onkeyup="textValidator(this,'','chequeBookMaster','number_of_checks')">
            </div>
            <div class="col-md-3">
                <label for="textStartNumber" class="form-label fw-bold">Start Number <i class="text-danger">*</i> </label>
                <input type="text" id="textStartNumber" class="form-control text-start" placeholder="Enter Start Number" onkeyup="textValidator(this,'','chequeBookMaster','start_number')">
            </div>
        </div>
<!--     first row end           -->

<!--     second row start    -->
        <div class="row mt-5">
            <div class="col-md-3">
                <label for="textEndNumber" class="form-label fw-bold">End Number <i class="text-danger">*</i> </label>
                <input type="text" id="textEndNumber" class="form-control text-start" placeholder="Enter End Number" onkeyup="textValidator(this,'','chequeBookMaster','end_number')">
            </div>
            <div class="col-md-3">
                <label for="selectStatus" class="form-label fw-bold">Status <i class="text-danger">*</i> </label>
                <select id="selectStatus" class="form-select text-start" onchange="selectDBValidator(this,'','chequeBookMaster','checkbookmasterstatus_id')"></select>
            </div>
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
        </div>
<!--     second row end    -->


<!--button row start-->
        <div class="row mt-5">
            <div class="col-md-4 text-start">
                <button type="button" class="btn btn-danger" onclick="refreshChequeBookMasterForm()">Reset</button>
            </div>
            <div class="col-md-4 text-center">
                <button type="button" id="buttonChequeBookUpdate" style="pointer-events: all" class="btn btn-warning" onclick="updateChequeBookMaster()">Update</button>
            </div>
            <div class="col-md-4 text-end">
                <button type="button" id="buttonChequeBookAdd" style="pointer-events: all" class="btn btn-primary" onclick="submitCheque()">Submit</button>
            </div>
        </div>
<!--button row end-->


    </form>
</div>
<!--   form area end    -->


<!--  print button to print full table start   -->
    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4"></div>
        <div class="col-md-4 text-end">
            <button type="button" class="btn btn-primary" onclick="printAllChequeBooks()">Print Full Table</button>
        </div>
    </div>
<!--  print button to print full table end   -->




<!--table area start-->
<div class="card m-5 p-5">
    <table class="table table-bordered" id="tableChequeBookMaster">
        <thead>
            <th>#</th>
            <th>Bank Short Name</th>
            <th>Running Number</th>
            <th>Number Of Cheques</th>
            <th>Start Number</th>
            <th>End Number</th>
            <th>Status</th>
            <th>Action</th>
        </thead>
        <tbody></tbody>
    </table>
</div>
<!--table area end-->



    <!--table area for print start-->
    <div class="d-none">
        <table class="table table-bordered" id="tableChequeBookMasterPrint" style="font-size: 11px">
            <thead class="text-center">
            <th>#</th>
            <th>Bank Short Name</th>
            <th>Running Number</th>
            <th>Number Of Cheques</th>
            <th>Start Number</th>
            <th>End Number</th>
            <th>Status</th>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <!--table area for print end-->


</div>
</body>
</html>
