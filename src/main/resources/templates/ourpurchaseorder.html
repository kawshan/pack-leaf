<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Purchase Order</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/ourpurchaseorder.js"></script>

    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->

</head>
<body>
<div class="container-fluid">

<!--header area start-->
<div class="row p-4" style="background-color: #54C392">
    <h1 class="text-center">Our PO</h1>
</div>
<!--header area start-->


    <!--button row start-->
    <div class="row mt-1 mb-1">


        <div class="col-md-3">
            <div id="divModifyButton" class="d-none">
                <div class="col-md-12">
                    <button type="button" class="btn btn-warning fw-bold"
                            style="width: 25%; color: whitesmoke; border: 1px solid black;"
                            onclick="refillOurPurchaseOrderHeader(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-recycle fa-beat"></i> Refill
                    </button>
                    <button type="button" class="btn btn-danger fw-bold"
                            style=" width: 25%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                            onclick="deleteOurPurchaseOrderHeader(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-trash fa-beat"></i> Delete
                    </button>
                    <button onclick="printOurPurchase(window['editOb'],window['editRow'])" type="button"
                            class="btn btn-primary fw-bold"
                            style=" width: 25%; color: whitesmoke;border: 1px solid black">
                        <i class="fa-solid fa-eye fa-beat"></i> Print
                    </button>
                </div>
            </div>
        </div>



        <div class="col-md-3"></div>
        <div class="col-md-3"></div>


        <div class="col-md-3">
            <button type="button" style="width: 20%; height: 40px" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Search</button>
        </div>


    </div>
    <!--button row end-->



    <!-- our po header  form area start-->
    <div class="card">
    <form onsubmit="return false">


        <!--button row start-->
        <div class="row mt-1">
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
            <div class="col-md-3">
                <button type="reset" class="btn btn-danger" style="margin-right: 10%">reset</button>
                <button type="button" class="btn btn-success" onclick="submitOurPoHeader()">Submit</button>
            </div>
            <div class="col-md-3"></div>
        </div>
        <!--button row start-->


        <div class="row mt-2">
            <div class="col-md-3">
                <label for="selectSupplier" class="form-label fw-bold"> Supplier Name <i class="text-danger">*</i>
                </label>
                <select id="selectSupplier" class="form-select text-start" onchange="selectDBValidator(this,'','ourpoheader','supplier_id'); showSupplierInformation(this)">
                    <option></option>
                </select>
                <p style="padding-left: 3%" id="displaySupplierName"></p>
                <p style="padding-left: 3%" id="displaySupplierAddress"></p>
                <p style="padding-left: 3%" id="displaySupplierMobileNumber"></p>
            </div>



            <div class="col-md-3">
<!--                why this is commented without commenting col md 3 because alignment problem occurred -->
<!--                <label for="selectCompanyName" class="form-label fw-bold"> Company Name <i class="text-danger">*</i>-->
<!--                </label>-->
<!--                <select id="selectCompanyName" class="form-select text-start">-->
<!--                    <option></option>-->
<!--                </select>-->
            </div>



            <div class="col-md-3">
                <label for="textDisplayOurPurchaseOrderKey">Purchase Order Key</label>
                <input type="text" id="textDisplayOurPurchaseOrderKey" disabled class="form-control text-center">
            </div>


            <div class="col-md-3">

                <table class="table table-bordered table-striped">
                    <tbody>

                    <!--                first row-->
                    <tr>
                        <td>
                            <label for="textRefQuotation" class="form-label fw-bold"> Ref Quotation</label>
                        </td>
                        <td>
                            <input type="text" id="textRefQuotation" class="form-control text-start"
                                   placeholder="Enter Ref Quotation" onkeyup="textValidator(this,'','ourpoheader','refquotation')">
                        </td>
                    </tr>
                    <!--                first row-->



                    <!--                Second row-->
                    <tr>
                        <td>
                            <label for="textOurPoNumber" class="form-label fw-bold"> PO Number <i
                                    class="text-danger">*</i> </label>
                        </td>
                        <td>
                            <input type="text" disabled id="textOurPoNumber" class="form-control text-start"
                                   placeholder="Enter PO NUmber" onkeyup="textValidator(this,'','ourpoheader','ourponumber')">
                        </td>
                    </tr>
                    <!--                Second row-->


                    <!--                Third row-->
                    <tr>
                        <td>
                            <label for="textPoDate" class="form-label fw-bold">Po Date <i class="text-danger">*</i> </label>

                        </td>
                        <td>
                            <input type="date" id="textPoDate" class="form-control" onchange="textValidator(this,'','ourpoheader','ourpodate')">
                        </td>
                    </tr>
                    <!--                Third row-->


                    </tbody>
                </table>
            </div>

        </div>


    </form>
</div>
    <!-- our po header  form area end-->


    <!--table our purchase order details form area start-->
    <form onsubmit="return false">
        <table class="table">
            <tbody>
            <tr>
                <td>
                    <label for="selectRawMaterial" class="form-label fw-bold">Select Raw Material</label>
                    <select id="selectRawMaterial" class="form-select" onchange="selectDBValidator(this,'','ourPurchaseOrderDetail','rawmaterial_id')"></select>
                </td>


                <td>
                    <label for="txtQty" class="form-label fw-bold">Item Qty</label>
                    <input type="text" id="txtQty" class="form-control" placeholder="enter item Quantity" onkeyup="textValidator(this,'^[1-9][0-9]{0,10}$','ourPurchaseOrderDetail','qty')">
                </td>


                <td>
                    <label for="txtRate" class="form-label fw-bold">Item Rate</label>
                    <input type="text" id="txtRate" class="form-control" placeholder="enter item Rate" onkeyup="textValidator(this,'','ourPurchaseOrderDetail','rate')">
                </td>

                <td style="padding-left: 10%">
                    <button type="button" class="btn btn-warning" style="width: 100px; height: 70px; pointer-events: all" id="buttonOurPurchaseOrderDetailsUpdate" onclick="updateOurPurchaseOrderDetail()">Update</button>
                    <button type="button" class="btn btn-success" style="width: 100px; height: 70px; pointer-events: all" id="buttonOurPurchaseOrderDetailsAdd" onclick="submitOurPurchaseOrderDetails()">Add</button>
                    <p class="text-danger" id="paragraphWarningMSJ">Please Complete Header Section First</p>
                </td>




            </tr>
            </tbody>
        </table>
    </form>
    <!--table our purchase order details form area end-->




    <!--    div modify button area for our purchase order detail start -->
    <div class="row">
        <div class="col-md-3">
            <div id="divModifyButton2" class="d-none">
                <div class="col-md-12">
                    <button type="button" class="btn btn-warning fw-bold"
                            style="width: 25%; color: whitesmoke; border: 1px solid black;"
                            onclick="refillOurPurchaseOrderDetails(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-recycle fa-beat"></i> Refill
                    </button>
                    <button type="button" class="btn btn-danger fw-bold"
                            style=" width: 25%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                            onclick="deleteOurPurchaseOrderDetail(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-trash fa-beat"></i> Delete
                    </button>
<!--                    <button onclick="printStudent(window['editOb'],window['editRow'])" type="button"-->
<!--                            class="btn btn-primary fw-bold d-none"-->
<!--                            style=" width: 25%; color: whitesmoke;border: 1px solid black">-->
<!--                        <i class="fa-solid fa-eye fa-beat"></i> Print-->
<!--                    </button>-->
                </div>
            </div>
        </div>
        <div class="col-md-3"></div>
        <div class="col-md-3"></div>
        <div class="col-md-3"></div>
    </div>
    <!--    div modify button area for our purchase order detail end -->



    <!--purchase order details table area start-->
    <div class="card mt-5 p-5 d-none" id="cardOurPurchaseOrderDetailsTableArea">
        <table class="table table-bordered" id="ourPurchaseOrderDetailsTable">

            <thead class="text-center">
            <th>#</th>
            <th>Raw Material name</th>
            <th>Qty</th>
            <th>rate</th>
            <th>action</th>
            </thead>

            <tbody></tbody>

        </table>
    </div>
    <!--purchase order details table area end-->


    <!--   our Purchase Order Header table area start  this is a modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">search</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <!--Table Our Purchase Order Header Start-->
                    <div class="card m-4">
                        <table class="table table-hover table-striped"  id="ourPurchaseOrderHeaderTable">
                            <thead>
                            <th>#</th>
                            <th>Supplier Name</th>
                            <th>Ref Quotation</th>
                            <th>PO Number</th>
                            <th>Date</th>
                            <th>Action</th>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!--Table Our Purchase Order Header Start-->

                </div>
            </div>
        </div>
    </div>
    <!--   our Purchase Order Header table area start   this is a modal-->



    <div class="card d-none">
        <table class="table table-bordered" id="printOurPurchaseOrderDetailsTable" style="border: 1px solid black">

            <thead class="text-center" style="font-size: 12px">
            <th>#</th>
            <th>Raw Material name</th>
            <th>Qty</th>
            <th>Rate</th>
            <th>Value</th>
            </thead>

            <tbody></tbody>

        </table>
    </div>


</div>
</body>
</html>
