<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supplier master</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/supplier.js"></script>

    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->

    <style>
        .material-symbols-outlined {
            font-variation-settings:
                    'FILL' 0,
                    'wght' 400,
                    'GRAD' 0,
                    'opsz' 24
        }
    </style>

</head>
<body>


<!--header area start-->
<div class="row p-4" style="background-color: #54C392;">
    <h1 class="text-center">Supplier Master</h1>
</div>
<!--header area start-->

<!--    edit delete print button start-->
<div class="row mt-2">

    <div class="col-md-6">
        <div id="divModifyButton" class="d-none">
            <div class="col-md-6">
                <button type="button" class="btn btn-warning fw-bold"
                        style="width: 25%; color: whitesmoke; border: 1px solid black;"
                        onclick="refillSupplier(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-recycle fa-beat"></i> Edit
                </button>
                <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                        style=" width: 25%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                        onclick="deleteSupplier(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-trash fa-beat"></i> Delete
                </button>
                <button onclick="printSupplierOneItem(window['editOb'],window['editRow'])" type="button"
                        class="btn btn-primary fw-bold"
                        style=" width: 25%; color: whitesmoke;border: 1px solid black">
                    <i class="fa-solid fa-eye fa-beat"></i> Print
                </button>
            </div>
        </div>
    </div>

    <div class="col-md-3"></div>
    <div class="col-md-3">
        <button type="button" style="width: 15%; height: 40px" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">print</button>
    </div>




</div>
<!--    edit delete print button end-->


<!--form area start-->
<div class="card m-5 p-5">
<form onsubmit="return false">

<!--    first row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtSupplierName" class="form-label fw-bold"> Supplier Name  <i class="text-danger">*</i>  </label>
            <input type="text" id="txtSupplierName" class="form-control text-start" placeholder="Enter Supplier name" onkeyup="textValidator(this,'','supplier','suppliername')">
        </div>
        <div class="col-md-3">
            <label for="txtSupplierAddress" class="form-label fw-bold"> Supplier Address</label>
            <input type="text" id="txtSupplierAddress" class="form-control text-start" placeholder="Enter Supplier Address" onkeyup="textValidator(this,'','supplier','supplieraddress')">
        </div>
        <div class="col-md-3"></div>
    </div>
<!--    first row end-->



    <!--    second row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtSupplierVatNo" class="form-label fw-bold"> Supplier Vat No </label>
            <input type="text" id="txtSupplierVatNo" class="form-control text-start" placeholder="Enter Supplier Vat No" onkeyup="textValidator(this,'','supplier','suppliervatno')">
        </div>
        <div class="col-md-3">
            <label for="txtSupplierTelephone" class="form-label fw-bold"> Supplier Telephone</label>
            <input type="text" id="txtSupplierTelephone" class="form-control text-start" placeholder="Enter Supplier Telephone" onkeyup="textValidator(this,'','supplier','suppliertelephone')">
        </div>
        <div class="col-md-3"></div>
    </div>
    <!--    second row end-->


    <!--    third row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtSupplierContactPerson" class="form-label fw-bold"> Supplier Contact Person</label>
            <input type="text" id="txtSupplierContactPerson" class="form-control text-start" placeholder="Enter Supplier Contact Person" onkeyup="textValidator(this,'','supplier','suppliercontactperson')">
        </div>
        <div class="col-md-3">
            <label for="txtSupplierCollectingAddress" class="form-label fw-bold"> Supplier Collecting Address</label>
            <input type="text" id="txtSupplierCollectingAddress" class="form-control text-start" placeholder="Enter Supplier Collecting Address" onkeyup="textValidator(this,'','supplier','suppliercollectingaddress')">
        </div>
        <div class="col-md-3"></div>
    </div>
    <!--    third row end-->



    <!--    forth row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtSupplierBank" class="form-label fw-bold"> Supplier Bank</label>
            <input type="text" id="txtSupplierBank" class="form-control text-start" placeholder="Enter Supplier Bank" onkeyup="textValidator(this,'','supplier','supplierbank')">
        </div>
        <div class="col-md-3">
            <label for="selectSupplierStatus" class="form-label fw-bold"> Supplier Status  <i class="text-danger">*</i>  </label>
            <select id="selectSupplierStatus" class="form-select text-start" onchange="selectValidator(this,'','supplier','supplierstatus')">
                <option selected disabled value="">select an option</option>
                <option value="true">active</option>
                <option value="false">in-active</option>
            </select>
        </div>
        <div class="col-md-3"></div>
    </div>
    <!--    forth row end-->


<!--button row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <button type="reset" class="btn btn-danger">reset</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="btn btn-warning" style="pointer-events: all" id="ButtonSupplierUpdate" onclick="updateSupplier()">Update</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="btn btn-success" style="pointer-events: all" id="ButtonSupplierAdd" onclick="saveSupplier()">Submit</button>
        </div>
    </div>
<!--button row start-->




</form>
</div>
<!--form area end-->

<!--table area start-->
<div class="card m-5 p-5">
    <table class="table table-bordered table-responsive-xl" id="supplierTable">

        <thead>
                <th>#</th>
                <th>Supplier Name</th>
                <th>Supplier Address</th>
                <th>Vat no</th>
                <th>Telephone</th>
                <th>Contact Person</th>
                <th>Collecting Address</th>
                <th>Bank</th>
                <th>Status</th>
                <th>Action</th>
        </thead>

        <tbody>
        </tbody>

    </table>
</div>
<!--table area end-->


<!--    print full Supplier table modal area start-->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel2">Print Suppliers</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

                <!--table invoice header start-->

                    <table class="table table-responsive table-bordered"  id="printSupplierTable" style="font-size: 12px">
                        <thead>
                        <th>#</th>
                        <th>Supplier Name</th>
                        <th>Supplier Address</th>
                        <th>Vat No</th>
                        <th>Telephone</th>
                        <th>Contact Person</th>
                        <th>Collecting Address</th>
                        <th>Bank</th>
                        <th>Status</th>
                        </thead>
                        <tbody></tbody>
                    </table>

                <!--table invoice header end-->

            </div>


            <div class="modal-footer" id="ExampleModelFooterDiv">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="printSupplierModelButtonMC()" >Print</button>
            </div>


        </div>
    </div>
</div>
<!--    print full Supplier table modal area start-->


</body>
</html>
