<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raw Material Category</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>

    <script src="/controllerjs/rawmaterialcategory.js"></script>


    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->


</head>
<body>
<div class="container-fluid">

<!--header area start-->
<div class="row" style="background-color: #54C392;">
    <h1 class="p-4 text-center">Raw Material Category</h1>
</div>
<!--header area start-->


<!--    edit delete print button start-->
<div class="row mt-2">
    <div id="divModifyButton" class="d-none">
        <div class="col-md-6">
            <button type="button" class="btn btn-warning fw-bold"
                    style="width: 15%; color: whitesmoke; border: 1px solid black;"
                    onclick="refillRawMaterials(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-recycle fa-beat"></i> Refill
            </button>
            <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                    style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                    onclick="deleteRawMaterialCategory(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-trash fa-beat"></i> Delete
            </button>
            <button onclick="printOneRawMaterialCategory(window['editOb'],window['editRow'])" type="button"
                    class="btn btn-primary fw-bold"
                    style=" width: 15%; color: whitesmoke;border: 1px solid black">
                <i class="fa-solid fa-eye fa-beat"></i> Print
            </button>
        </div>
    </div>
</div>
<!--    edit delete print button end-->


<!--form area start-->
<div class="card m-5 p-5">
<form onsubmit="return false">

    <!--    first row start-->
    <div class="row">

        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="textRmCtCode" class="form-label fw-bold">Category Code<i class="text-danger">*</i></label>
            <input type="text" id="textRmCtCode" class="form-control text-start" placeholder="Enter Category Code" onkeyup="textValidator(this,'','rawmaterialcategory','rmctcode')">
        </div>
        <div class="col-md-3">
            <label for="textRmCtSize" class="form-label fw-bold">Category Size</label>
            <input type="text" id="textRmCtSize" class="form-control text-start" placeholder="Enter Category Size" onkeyup="textValidator(this,'','rawmaterialcategory','rmctsize')">
        </div>
        <div class="col-md-3"></div>

    </div>
    <!--    first row end-->


    <!--    second row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="textRmCtName" class="form-label fw-bold">Category Name <i class="text-danger">*</i> </label>
            <input type="text" id="textRmCtName" class="form-control text-start" placeholder="Enter Category Name" onkeyup="textValidator(this,'','rawmaterialcategory','rmctname')">
        </div>
        <div class="col-md-3">
            <label for="txtRmCtVolume" class="form-label fw-bold ">Category Volume </label>
            <input type="text" id="txtRmCtVolume" class="form-control text-start" placeholder="Enter Category Volume" onkeyup="textValidator(this,'','rawmaterialcategory','rmctvolumme')" >

        </div>
        <div class="col-md-3"></div>
    </div>
    <!--    second row end-->


    <!--third row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtRmCtShape" class="form-label fw-bold ">Category Shape </label>
            <input type="text" id="txtRmCtShape" class="form-control text-start" placeholder="Enter Category Shape" onkeyup="textValidator(this,'','rawmaterialcategory','rmctshape')">

        </div>
        <div class="col-md-3">
            <label for="txtRmCtMOQ" class="form-label fw-bold ">Category MOQ </label>
            <input type="text" id="txtRmCtMOQ" class="form-control text-start" placeholder="Enter Category MOQ" onkeyup="textValidator(this,'','rawmaterialcategory','rmctmoq')">

        </div>
        <div class="col-md-3"></div>
    </div>
    <!--third row start-->


    <!--forth row start    -->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtRmCtDuration" class="form-label fw-bold ">Category Duration </label>
            <input type="text" id="txtRmCtDuration" class="form-control text-start" placeholder="Enter Category Duration" onkeyup="textValidator(this,'','rawmaterialcategory','rmctduration')">

        </div>
        <div class="col-md-3">
            <label for="txtRmCtPackaging" class="form-label fw-bold ">Category Packaging  </label>
            <input type="text" id="txtRmCtPackaging" class="form-control text-start" placeholder="Enter Category Packaging" onkeyup="textValidator(this,'','rawmaterialcategory','rmctpacking')">

        </div>
        <div class="col-md-3"></div>
    </div>
    <!--forth row end    -->


    <!--fifth row start    -->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-6">
            <label for="txtRmCtDescription" class="form-label fw-bold ">Category Description </label>
            <input type="text" id="txtRmCtDescription" class="form-control text-start" placeholder="Enter Category Description" onkeyup="textValidator(this,'','rawmaterialcategory','rmctdescription')">
        </div>

        <div class="col-md-3"></div>
    </div>
    <!--fifth row start-->


    <!--sixth row start    -->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtRmCtStatus" class="form-label fw-bold ">Category Status <i class="text-danger">*</i> </label>
           <select id="txtRmCtStatus" class="form-select text-center" onchange="selectValidator(this,'','rawmaterialcategory','rmctstatus')">
               <option selected disabled>select an option</option>
               <option value="true">Active</option>
               <option value="false">inactive</option>
           </select>
        </div>
        <div class="col-md-3"></div>
        <div class="col-md-3"></div>
    </div>
    <!--sixth row start-->


<!--    button raw start-->
    <div class="row mt-5">
        <div class="col-md-4 text-start">
            <button type="reset" class="btn btn-danger" style="width: 25%" >Reset</button>
        </div>
        <div class="col-md-4 text-center">
            <button type="button" class="btn btn-warning" style="width: 25%; pointer-events: all" id="btnRawMaterialCategoryUpdate" onclick="updateRawMaterial()" >Update</button>
        </div>
        <div class="col-md-4 text-end">
            <button type="button" class="btn btn-success" style="width: 25%; pointer-events: all" id="btnRawMaterialCategorySubmit" onclick="submitRawMaterial()">Submit</button>
        </div>
    </div>
<!--    button raw end-->



</form>
</div>
<!--form area end-->

<!--table area start-->
<div class="card m-5 p-5">
    <table class="table table-hover table-striped" id="tableRawMaterialCategory">

        <thead>
                <th>#</th>
                <th>Code</th>
                <th>Name</th>
                <th>Size</th>
                <th>Shape</th>
                <th>Description</th>
                <th>Volume</th>
                <th>MOQ</th>
                <th>Duration</th>
                <th>Category Packaging</th>
                <th>Status</th>
                <th>Action</th>
        </thead>

        <tbody>

        </tbody>

    </table>
</div>
<!--table area end-->




</div>
</body>
</html>
