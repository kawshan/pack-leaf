<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Own bank Account master</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/ownbankaccountdetailsmaster.js"></script>

    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->


</head>
<body>
<div class="container-fluid">

    <!--header area start-->
    <div class="row p-4" style="background-color: #54C392">
        <h1 class="text-center">Own Bank Account Master</h1>
    </div>
    <!--header area start-->

    <!--    edit delete print button start-->
    <div class="row mt-2">
        <div id="divModifyButton" class="d-none">
            <div class="col-md-6">
                <button type="button" class="btn btn-warning fw-bold"
                        style="width: 15%; color: whitesmoke; border: 1px solid black;"
                        onclick="refillOwnBankAccountDetails(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-recycle fa-beat"></i> Refill
                </button>
                <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                        style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                        onclick="deleteOwnBankAccountDetails(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-trash fa-beat"></i> Delete
                </button>
                <button onclick="oneBankAccountDetailPrint(window['editOb'],window['editRow'])" type="button"
                        class="btn btn-primary fw-bold"
                        style=" width: 15%; color: whitesmoke;border: 1px solid black">
                    <i class="fa-solid fa-eye fa-beat"></i> Print
                </button>
            </div>
        </div>
    </div>
    <!--    edit delete print button end-->


<!--  form area start   -->
<div class="card m-5 p-5">
    <form onsubmit="return false">



        <!--    first row start-->
        <div class="row mt-5">
            <div class="col-md-3">
                <label for="textBankShortName" class="form-label fw-bold">Bank Short Name <i class="text-danger">*</i> </label>
                <input type="text" id="textBankShortName" class="form-control text-start" placeholder="Enter Bank Short Name" onkeyup="textValidator(this,'','ownBankAccount','bank_short_name')">
            </div>
            <div class="col-md-3">
                <label for="textBankAccountName" class="form-label fw-bold">Bank Account Name <i class="text-danger">*</i> </label>
                <input type="text" class="form-control text-start" id="textBankAccountName" placeholder="Enter Account Name" onkeyup="textValidator(this,'','ownBankAccount','bank_account_name')">
            </div>
            <div class="col-md-3">
                <label for="textBankName" class="form-label fw-bold">Bank Name <i class="text-danger">*</i> </label>
                <input type="text" class="form-control text-start" id="textBankName" placeholder="Enter Bank Name" onkeyup="textValidator(this,'','ownBankAccount','bank_name')">
            </div>
            <div class="col-md-3">
                <label for="textBankCode" class="form-label fw-bold">Bank Code </label>
                <input type="text" class="form-control text-start" id="textBankCode" placeholder="Enter Bank Code" onkeyup="textValidator(this,'','ownBankAccount','bank_code')">
            </div>
        </div>
        <!--    first row end-->


        <!--    second row start-->
        <div class="row mt-5">
            <div class="col-md-3">
                <label for="textBranchName" class="form-label fw-bold">Branch Name <i class="text-danger">*</i> </label>
                <input type="text" class="form-control text-start" id="textBranchName" placeholder="Enter Branch Name" onkeyup="textValidator(this,'','ownBankAccount','branch_name')">
            </div>
            <div class="col-md-3">
                <label for="textBranchCode" class="form-label fw-bold">Branch Code </label>
                <input type="text" class="form-control text-start" id="textBranchCode" placeholder="Enter Branch Code" onkeyup="textValidator(this,'','ownBankAccount','branch_code')">
            </div>
            <div class="col-md-3">
                <label for="textBankAccountNo" class="form-label fw-bold">Bank Account No <i class="text-danger">*</i> </label>
                <input type="text" class="form-control text-start" id="textBankAccountNo" placeholder="Enter Account Number" onkeyup="textValidator(this,'','ownBankAccount','account_no')">
            </div>
            <div class="col-md-3">
                <label for="textDescription" class="form-label fw-bold">Description </label>
                <input type="text" class="form-control text-start" id="textDescription" placeholder="Enter Description" onkeyup="textValidator(this,'','ownBankAccount','bank_description')">
            </div>
        </div>
        <!--    second row end-->



        <!--         third row start  -->
        <div class="row mt-5">
            <div class="col-md-3">
                <label for="selectOwnBankStatus" class="form-label fw-bold">Bank Status <i class="text-danger">*</i> </label>
                <select class="form-select text-start" id="selectOwnBankStatus" onchange="selectDBValidator(this,'','ownBankAccount','ownbankaccountstatus_id')"></select>
            </div>
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
        </div>
        <!--         third row end  -->


<!--        button row start-->
        <div class="row mt-5">
            <div class="col-md-4 text-start">
                <button type="button" class="btn btn-danger">Reset</button>
            </div>
            <div class="col-md-4 text-center">
                <button type="button" id="buttonUpdateOwnBankAccount" style="pointer-events: all;" class="btn btn-warning" onclick="updateOwnBankAccountDetails()">Update</button>
            </div>
            <div class="col-md-4 text-end">
                <button type="button" id="buttonAddOwnBankAccount" style="pointer-events: all;" class="btn btn-primary" onclick="submitOwnBankAccountDetails()">Submit</button>
            </div>
        </div>
<!--        button row end-->







    </form>
</div>
<!--  form area end   -->

<!--  print button to view full table start   -->
<div class="row">
    <div class="col-md-3"></div>
    <div class="col-md-3"></div>
    <div class="col-md-3"></div>
    <div class="col-md-3 text-end">
        <button type="button" class="btn btn-primary" onclick="printFullOwnBankAccountsTable()">Print Bank Account Details</button>
    </div>
</div>
<!--  print button to view full table end   -->


<!--    table area start    -->
<div class="card p-5 mt-5">
<table class="table table-bordered" id="tableOwnBankAccount">
    <thead class="text-center">
        <th>#</th>
        <th>Bank Short Name</th>
        <th>Account Name</th>
        <th>Bank Name</th>
        <th>Bank Code</th>
        <th>Branch Name</th>
        <th>Branch Code</th>
        <th>Status</th>
        <th>Action</th>
    </thead>
    <tbody></tbody>
</table>
</div>
<!--    table area end      -->

<!--    table print area start     -->
<div class="d-none">
    <table class="table table-bordered" id="tableOwnBankAccountPrint" style="font-size: 12px">
        <thead class="text-center">
        <th>#</th>
        <th>Bank Short Name</th>
        <th>Account Name</th>
        <th>Bank Name</th>
        <th>Bank Code</th>
        <th>Branch Name</th>
        <th>Branch Code</th>
        <th>Status</th>
        </thead>
        <tbody></tbody>
    </table>
</div>
<!--    table print area end     -->



</div>
</body>
</html>
