<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<!--    data tables cdn start-->
    <script src="/commonjs/jquery.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.7/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.1.7/js/dataTables.min.js"></script>
    <!--    data tables cdn end-->

    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/ItemCategory.js"></script>
</head>
<body>


<!--header area start-->
<div class="row p-4" style="background-color: #F5EFFF; width: 100%; height: 100px ">
    <h1 class="text-center">Item Category Master</h1>
</div>
<!--header area start-->



<!--    edit delete print button start-->
<div class="row mt-2">
    <div id="divModifyButton" class="d-none">
        <div class="col-md-6">
            <button type="button" class="btn btn-warning fw-bold"
                    style="width: 15%; color: whitesmoke; border: 1px solid black;"
                    onclick="refillItemCategory(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-recycle fa-beat"></i> Edit
            </button>
            <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                    style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                    onclick="deleteItemCategory(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-trash fa-beat"></i> Delete
            </button>
            <button onclick="printStudent(window['editOb'],window['editRow'])" type="button"
                    class="btn btn-primary fw-bold"
                    style=" width: 15%; color: whitesmoke;border: 1px solid black">
                <i class="fa-solid fa-eye fa-beat"></i> Print
            </button>
        </div>
    </div>
</div>
<!--    edit delete print button end-->


<!--form area start-->
<div class="card m-5 p-5">
    <form onsubmit="return false" id="itemCategoryForm">

        <!--    first row start-->
        <div class="row">

            <div class="col-md-3"></div>
            <div class="col-md-3">
                <label for="txtCtCode" class="form-label fw-bold"> Category Code  <i class="text-danger">*</i>  </label>
                <input type="text" id="txtCtCode" class="form-control text-start" placeholder="Enter Category Code" onkeyup="textValidator(this,'','itemCategory','ctcode')">
            </div>
            <div class="col-md-3">
                <label for="txtCtSize" class="form-label fw-bold">Category Size <i class="text-danger">*</i> </label>
                <input type="text" id="txtCtSize" class="form-control text-start" placeholder="Enter Category Size" onkeyup="textValidator(this,'','itemCategory','ctsize')">
            </div>
            <div class="col-md-3"></div>

        </div>
        <!--    first row end-->


        <!--    second row start-->
        <div class="row mt-5">
            <div class="col-md-3"></div>
            <div class="col-md-3">
                <label for="txtCtName" class="form-label fw-bold">Category Name <i class="text-danger">*</i> </label>
                <input type="text" id="txtCtName" class="form-control text-start" placeholder="Enter Category Name" onkeyup="textValidator(this,'','itemCategory','ctname')">
            </div>
            <div class="col-md-3">
                <label for="txtCtVolume" class="form-label fw-bold ">Category Volume <i class="text-danger">*</i> </label>
                <input type="text" id="txtCtVolume" class="form-control text-start" placeholder="Enter Category Volume" onkeyup="textValidator(this,'','itemCategory','ctvolumme')">

            </div>
            <div class="col-md-3"></div>
        </div>
        <!--    second row end-->



        <!--third row start-->
        <div class="row mt-5">
            <div class="col-md-3"></div>
            <div class="col-md-3">
                <label for="txtCtShape" class="form-label fw-bold ">Category Shape <i class="text-danger">*</i> </label>
                <input type="text" id="txtCtShape" class="form-control text-start" placeholder="Enter Category Shape" onkeyup="textValidator(this,'','itemCategory','ctshape')" >

            </div>
            <div class="col-md-3">
                <label for="txtCtMOQ" class="form-label fw-bold ">Category MOQ  </label>
                <input type="text" id="txtCtMOQ" class="form-control text-start" placeholder="Enter Category MOQ" onkeyup="textValidator(this,'','itemCategory','ctmoq')">

            </div>
            <div class="col-md-3"></div>
        </div>
        <!--third row start-->


        <!--forth row start    -->
        <div class="row mt-5">
            <div class="col-md-3"></div>
            <div class="col-md-3">
                <label for="txtCtDuration" class="form-label fw-bold ">Category Duration  </label>
                <input type="text" id="txtCtDuration" class="form-control text-start" placeholder="Enter Category Duration" onkeyup="textValidator(this,'','itemCategory','ctduration')">

            </div>
            <div class="col-md-3">
                <label for="txtCtPackaging" class="form-label fw-bold ">Category Packaging  </label>
                <input type="text" id="txtCtPackaging" class="form-control text-start" placeholder="Enter Category Packaging" onkeyup="textValidator(this,'','itemCategory','ctpacking')" >

            </div>
            <div class="col-md-3"></div>
        </div>
        <!--forth row end    -->



        <!--fifth row start    -->
        <div class="row mt-5">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <label for="txtCtDescription" class="form-label fw-bold ">Category Description  </label>
                <input type="text" id="txtCtDescription" class="form-control text-start" placeholder="Enter Category Description" onkeyup="textValidator(this,'','itemCategory','ctdescription')">
            </div>

            <div class="col-md-3"></div>
        </div>
        <!--fifth row start-->

        <div class="row mt-5">
            <div class="col-md-3"></div>
            <div class="col-md-3">
                <button type="reset" class="btn btn-danger">reset</button>
            </div>
            <div class="col-md-3 text-start">
                <button type="button" class="btn btn-warning" id="buttonUpdate" onclick="updateItemCategory()"> submit</button>
            </div>
            <div class="col-md-3">
                <button type="button" class="btn btn-primary" onclick="submitItemCategory()"> submit</button>
            </div>
        </div>






    </form>
</div>
<!--form area end-->

<!--table area start-->
<!--<div class="card mt-5 p-5">-->
    <table class="table table-hover table-striped" id="itemCategoryTable">

        <thead>
        <th>#</th>
        <th>Category Code</th>
        <th>Category Name</th>
        <th>Category Size</th>
        <th>Category Shape</th>
        <th>Category Description</th>
        <th>Category Volume</th>
        <th>Category MOQ</th>
        <th>Category Duration</th>
        <th>Category Packaging</th>
        <th>Action</th>
        </thead>

        <tbody>
        <tr>
            <td>1</td>
            <td>LK100</td>
            <td>LK100</td>
            <td>95 X 72 X 131(h) mm</td>
            <td>Rectangle box with narrow edges</td>
            <td>description</td>
            <td>volume</td>
            <td>MOQ</td>
            <td>duration</td>
            <td>packaging</td>
            <td>
                <button type="button" class="btn btn-danger">delete</button>
                <button type="button" class="btn btn-warning">modify</button>
                <button type="button" class="btn btn-success">print</button>

            </td>
        </tr>
        </tbody>

    </table>
<!--</div>-->
<!--table area end-->



</body>
</html>
