<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/rawmaterial.js"></script>


    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->

</head>
<body>
<div class="container-fluid">

<!--header area start-->
<div class="row" style="background-color: #54C392;">
    <h1 class="p-4 text-center">Raw Material</h1>
</div>
<!--header area start-->

    <!--    edit delete print button start-->
    <div class="row mt-2">
        <div id="divModifyButton" class="d-none">
            <div class="col-md-6">
                <button type="button" class="btn btn-warning fw-bold"
                        style="width: 15%; color: whitesmoke; border: 1px solid black;"
                        onclick="refillRawMaterial(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-recycle fa-beat"></i> Refill
                </button>
                <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                        style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                        onclick="deleteRawMaterial(window['editOb'],window['editRow'])">
                    <i class="fa-solid fa-trash fa-beat"></i> Delete
                </button>
                <button onclick="printRawMaterialOneItem(window['editOb'],window['editRow'])" type="button"
                        class="btn btn-primary fw-bold"
                        style=" width: 15%; color: whitesmoke;border: 1px solid black">
                    <i class="fa-solid fa-eye fa-beat"></i> Print
                </button>
            </div>
        </div>
    </div>
    <!--    edit delete print button end-->


<!--form area start-->
<div class="card m-5 p-5">
<form onsubmit="return false">

<!--    first row start-->
    <div class="row">

        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="selectRmCt" class="form-label fw-bold">Raw Material Category <i class="text-danger">*</i> </label>
            <select id="selectRmCt" class="form-select text-center" onchange="selectDBValidator(this,'','rawmaterial','rawmaterialcategory_id')"></select>
        </div>
        <div class="col-md-3">
            <label for="textRmName" class="form-label fw-bold">Raw Material Name <i class="text-danger">*</i> </label>
            <input type="text" id="textRmName" class="form-control text-start" placeholder="Enter Raw Material Name" onkeyup="textValidator(this,'','rawmaterial','rmname')">
        </div>
        <div class="col-md-3"></div>

    </div>
<!--    first row end-->


    <!--    second row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="selectRmForm" class="form-label fw-bold">Raw Material Form <i class="text-danger">*</i> </label>
            <select id="selectRmForm" class="form-select text-start" onchange="selectValidator(this,'','rawmaterial','rmform')">
                <option value="" selected disabled>Select An Option</option>
                <option value="sheets">sheets</option>
                <option value="liters">liters</option>
                <option value="Kg">kg</option>
                <option value="roll">roll</option>
                <option value="mille liter">mille liter</option>
                <option value="40 ml bottle">40 ml bottle</option>
                <option value="5 liter tin">5 liter tin</option>
                <option value="30 liter can">30 liter can</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="txtRmPacking" class="form-label fw-bold ">Raw Material Packing </label>
            <input type="text" id="txtRmPacking" class="form-control text-start" placeholder="Enter Raw Material Packing" onkeyup="textValidator(this,'','rawmaterial','rmpacking')">
        </div>
        <div class="col-md-3"></div>
    </div>
    <!--    second row end-->


    <!--third row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtRmQty" class="form-label fw-bold ">Raw Material QTY  </label>
            <input type="text" id="txtRmQty" class="form-control text-start" placeholder="Enter Raw Material QTY" onkeyup="textValidator(this,'','rawmaterial','rmqty')">

        </div>
        <div class="col-md-3">
            <label for="txtRmRate" class="form-label fw-bold ">Raw Material Rate </label>
            <input type="text" id="txtRmRate" class="form-control text-start" placeholder="Enter Raw Material Rate" onkeyup="textValidator(this,'','rawmaterial','rmrate')">

        </div>
        <div class="col-md-3"></div>
    </div>
    <!--third row start-->


    <!--forth row start    -->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtRmReOrderLevel" class="form-label fw-bold ">Raw Material Re Order Level </label>
            <input type="text" id="txtRmReOrderLevel" class="form-control text-start" placeholder="Enter Raw Material Re order level" onkeyup="textValidator(this,'','rawmaterial','rmreorderlevel')">

        </div>
        <div class="col-md-3">
            <label for="SelectRmStatus" class="form-label fw-bold ">Raw Material Status <i class="text-danger">*</i> </label>
            <select id="SelectRmStatus" class="form-select text-center"  onchange="selectValidator(this,'','rawmaterial','rmstatus')" >
                <option selected disabled value="">Select Status</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>


        </div>
        <div class="col-md-3"></div>
    </div>
    <!--forth row end    -->

<!--    button raw start-->
    <div class="row mt-5">
        <div class="col-md-4 text-start">
            <button type="reset" class="btn btn-danger" style="width: 25%;">Reset</button>
        </div>
        <div class="col-md-4 text-center">
            <button type="button" class="btn btn-warning" style="width: 25%; pointer-events: all" id="rawMaterialButtonUpdate" onclick="updateRawMaterial()">Update</button>
        </div>
        <div class="col-md-4 text-end">
            <button type="button" class="btn btn-success" style="width: 25%; pointer-events: all" id="rawMaterialButtonSubmit" onclick="submitRawMaterial()">Submit</button>
        </div>
    </div>
<!--    button raw end-->



</form>
</div>
<!--form area end-->

    <div class="row m-5 p-5">
        <div class="col-md-3"></div>
        <div class="col-md-3"></div>
        <div class="col-md-3"></div>
        <div class="col-md-3 text-end">
            <button type="button" style="width: 20%; height: 40px" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">print</button>
        </div>
    </div>



<!--table area start-->
<div class="card m-5 p-5">
    <table class="table table-hover table-striped" id="tableRawMaterial">

        <thead>
                <th>#</th>
                <th>Raw Material category</th>
                <th>Name</th>
                <th>Form</th>
                <th>Packing</th>
                <th>QTY</th>
                <th>Rate</th>
                <th>Re order level</th>
                <th>Status</th>
                <th>Action</th>
        </thead>

        <tbody>

        </tbody>

    </table>
</div>
<!--table area end-->



    <!--    print full raw materials table modal area start-->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel2">Print</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <!--table invoice header start-->
                    <div class="card m-4">
                        <table class="table table-bordered"  id="printRawMaterialTable">
                            <thead class="table-header">
                            <th>#</th>
                            <th>Raw Material category</th>
                            <th>Name</th>
                            <th>Form</th>
                            <th>Packing</th>
                            <th>QTY</th>
                            <th>Rate</th>
                            <th>Raw material Status</th>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!--table invoice header end-->

                </div>


                <div class="modal-footer" id="ExampleModelFooterDiv">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="printRawMaterialModelButtonMC()" >Print</button>
                </div>


            </div>
        </div>
    </div>
    <!--    print full raw materials table modal area start-->




</div>
</body>
</html>
