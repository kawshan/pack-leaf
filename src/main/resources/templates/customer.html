<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/customer.js"></script>



</head>
<body>


<!--header area start-->
<div class="row p-4" style="background-color: #54C392; width: 100%; height: 100px ">
    <h1 class="text-center">Customer Master</h1>
</div>
<!--header area start-->


<!--    edit delete print button start-->
<div class="row mt-2">
    <div id="divModifyButton" class="d-none">
        <div class="col-md-6">
            <button type="button" class="btn btn-warning fw-bold"
                    style="width: 15%; color: whitesmoke; border: 1px solid black;"
                    onclick="refillCustomer(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-recycle fa-beat"></i> Edit
            </button>
            <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                    style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                    onclick="deleteCustomer(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-trash fa-beat"></i> Delete
            </button>
            <button onclick="printStudent(window['editOb'],window['editRow'])" type="button"
                    class="btn btn-primary fw-bold"
                    style=" width: 15%; color: whitesmoke;border: 1px solid black">
                <i class="fa-solid fa-eye fa-beat"></i> Print
            </button>
        </div>
    </div>
</div>
<!--    edit delete print button end-->


<!--form area start-->
<div class="card m-5 p-5">
<form onsubmit="return false">

<!--    first row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtCustomerName" class="form-label fw-bold"> Customer Name  <i class="text-danger">*</i>  </label>
            <input type="text" id="txtCustomerName" class="form-control text-start" placeholder="Enter customer name" onkeyup="textValidator(this,'','customer','customername')" >
        </div>
        <div class="col-md-3">
            <label for="txtCustomerAddress" class="form-label fw-bold"> Customer Address  <i class="text-danger">*</i>  </label>
            <input type="text" id="txtCustomerAddress" class="form-control text-start" placeholder="Enter Customer Address" onkeyup="textValidator(this,'','customer','customeraddress')" >
        </div>
        <div class="col-md-3"></div>
    </div>
<!--    first row end-->



    <!--    second row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtCustomerVatNo" class="form-label fw-bold"> Customer Vat No  <i class="text-danger">*</i>  </label>
            <input type="text" id="txtCustomerVatNo" class="form-control text-start" placeholder="Enter customer Vat No" onkeyup="textValidator(this,'','customer','customervatno')" >
        </div>
        <div class="col-md-3">
            <label for="txtCustomerTelephone" class="form-label fw-bold"> Customer Telephone  <i class="text-danger">*</i>  </label>
            <input type="text" id="txtCustomerTelephone" class="form-control text-start" placeholder="Enter customer Telephone" onkeyup="textValidator(this,'','customer','customertelephone')" >
        </div>
        <div class="col-md-3"></div>
    </div>
    <!--    second row end-->


    <!--    third row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtCustomerContactPerson" class="form-label fw-bold"> Customer Contact Person  <i class="text-danger">*</i>  </label>
            <input type="text" id="txtCustomerContactPerson" class="form-control text-start" placeholder="Enter customer Contact Person" onkeyup="textValidator(this,'','customer','customercontactperson')" >
        </div>
        <div class="col-md-3">
            <label for="txtCustomerDeliveryAddress" class="form-label fw-bold"> Customer Delivery Address  <i class="text-danger">*</i>  </label>
            <input type="text" id="txtCustomerDeliveryAddress" class="form-control text-start" placeholder="Enter customer Delivery Address" onkeyup="textValidator(this,'','customer','customerdeliveryaddress')" >
        </div>
        <div class="col-md-3"></div>
    </div>
    <!--    third row end-->



    <!--    forth row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <label for="txtCustomerBank" class="form-label fw-bold"> Customer Bank  <i class="text-danger">*</i>  </label>
            <input type="text" id="txtCustomerBank" class="form-control text-start" placeholder="Enter customer Bank" onkeyup="textValidator(this,'','customer','customerbank')" >
        </div>
        <div class="col-md-3">
            <label for="selectCustomerStatus" class="form-label fw-bold"> Customer Status  <i class="text-danger">*</i>  </label>
            <select id="selectCustomerStatus" class="form-select text-start" onchange="selectValidator(this,'','customer','customerstatus')">
                <option selected disabled>select an option</option>
                <option value="true">active</option>
                <option value="false">in-active</option>
            </select>
        </div>
        <div class="col-md-3"></div>
    </div>
    <!--    forth row end-->






<!--button row start-->
    <div class="row mt-5">
        <div class="col-md-3"></div>
        <div class="col-md-3">
            <button type="reset" class="btn btn-danger">reset</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="btn btn-warning" id="btnUpdate" style="pointer-events: all" onclick="updateCustomer()">Update</button>
        </div>
        <div class="col-md-3">
            <button type="reset" class="btn btn-success" onclick="submitCustomer()">Submit</button>
        </div>
    </div>
<!--button row start-->




</form>
</div>
<!--form area end-->

<!--table area start-->
<div class="card mt-5 p-5">
    <table class="table table-hover table-striped" id="customerTable">

        <thead>
                <th>#</th>
                <th>Customer Name</th>
                <th>Customer Key</th>
                <th>Customer Address</th>
                <th>Customer Vat no</th>
                <th>Customer Telephone</th>
                <th>Customer Contact Person</th>
                <th>Customer Delivery Address</th>
                <th>Customer Bank</th>
                <th>Customer Status</th>
                <th>Action</th>
        </thead>

        <tbody>
        </tbody>

    </table>
</div>
<!--table area end-->



</body>
</html>
