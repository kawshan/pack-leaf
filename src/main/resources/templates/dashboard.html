<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pack Leaf 🍃</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!--    google icons link-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>
<body>
<!--nav bar starts-->
<nav class="navbar navbar-expand-lg bg-body-tertiary" >
    <div class="container-fluid">

        <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#staticBackdrop" aria-controls="staticBackdrop">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <a class="navbar-brand"><b>Pack Leaf</b></a>




        <div class="collapse navbar-collapse" id="navbarNav">

        </div>


    </div>
</nav>
<!--nav bar ends-->


<!--off canvas start-->
<div class="offcanvas offcanvas-start" data-bs-backdrop="static" tabindex="-1" id="staticBackdrop" aria-labelledby="staticBackdropLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="staticBackdropLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">



<div class="row mt-2">
<!--item collapse start-->
        <p class="d-inline-flex gap-1">
            <button class="btn" style="background-color: #54C392; padding-bottom: 5%" type="button" data-bs-toggle="collapse" data-bs-target="#ItemExample" aria-expanded="false" aria-controls="ItemExample">
                <span class="material-symbols-outlined">category</span> Item Section
            </button>
        </p>
        <div class="collapse" id="ItemExample">
            <div class="card card-body">
                <ul class="list-group">
                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/item-category'">Item Category Master</button>
                    </li>
                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/item' ">Item Master</button>
                    </li>
                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/customer' ">Customer Master</button>
                    </li>

                    <li class="list-group-item">
                        <button type="button" class="btn" onclick="window.location.href='/purchaseorderheader'">Customer Purchase Order</button>
                    </li>

                    <li class="list-group-item">
                        <button type="button" class="btn" onclick="window.location.href='/invoice-detail'">Invoice</button>
                    </li>

                </ul>
            </div>
        </div>
<!--item collapse end-->
</div>


<div class="row mt-2">
        <!--stock collapse start-->
        <p class="d-inline-flex gap-1">
            <button class="btn" style="background-color: #54C392; padding-bottom: 5%" type="button" data-bs-toggle="collapse" data-bs-target="#StockExample" aria-expanded="false" aria-controls="ItemExample">
                <span class="material-symbols-outlined">category</span> Stock Section
            </button>
        </p>
        <div class="collapse" id="StockExample">
            <div class="card card-body">
                <ul class="list-group">


                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/supplier'">Supplier</button>
                    </li>


                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/rawmaterialcategory'">Raw Material Category</button>
                    </li>

                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/rawmaterial'">Raw Material</button>
                    </li>

                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/ourpoheader'">Our PO</button>
                    </li>

                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/grn-header'">GRN</button>
                    </li>

                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/jobmaster'">Job Master</button>
                    </li>

                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/issuenoteheader'">Issue Note</button>
                    </li>


                    <li class="list-group-item">
                        <button class="btn" onclick="window.location.href='/stockadjustmentheader'">Stock Adjustment</button>
                    </li>



                    <!--                    <li class="list-group-item">And a fifth one</li>-->
                </ul>
            </div>
        </div>
        <!--stock collapse end-->
</div>


<div class="row mt-2">
            <!--finance section collapse start-->
            <p class="d-inline-flex gap-1">
                <button class="btn" style="background-color: #54C392; padding-bottom: 5%" type="button" data-bs-toggle="collapse" data-bs-target="#FinanceExample" aria-expanded="false" aria-controls="ItemExample">
                    <span class="material-symbols-outlined">category</span> Bank Section
                </button>
            </p>
            <div class="collapse" id="FinanceExample">
                <div class="card card-body">
                    <ul class="list-group">


                        <li class="list-group-item">
                            <button class="btn" onclick="window.location.href='/ownbankaccount'">Own Bank Account Master</button>
                        </li>


                        <li class="list-group-item">
                            <button class="btn" onclick="window.location.href='/checkbookmaster'">Cheque Book Master</button>
                        </li>

                        <li class="list-group-item">
                            <button class="btn" onclick="window.location.href='/issuecheque'">Issue Cheque</button>
                        </li>

                        <li class="list-group-item">
                            <button class="btn" onclick="window.location.href='/paymentvoucherheader'">Payment Voucher</button>
                        </li>






                    </ul>
                </div>
            </div>
            <!--finance section collapse end-->
</div>





<div class="row mt-2">
            <!--report collapse start-->
            <p class="d-inline-flex gap-1">
                <button class="btn" style="background-color: #54C392; padding-bottom: 5%" type="button" data-bs-toggle="collapse" data-bs-target="#reportExample" aria-expanded="false" aria-controls="reportExample">
                    <span class="material-symbols-outlined">pie_chart</span> Report Section
                </button>
            </p>
            <div class="collapse" id="reportExample">
                <div class="card card-body">
                    <ul class="list-group">


                        <li class="list-group-item">
                            <button class="btn" onclick="window.location.href='/stockreport'">Stock Report</button>
                        </li>

                        <li class="list-group-item">
                            <button class="btn" onclick="window.location.href='/paymentvoucherreport'">Payment Voucher Summery</button>
                        </li>

                        <li class="list-group-item">
                            <button class="btn" onclick="window.location.href='/grnvouchersummary'">GRN Summery</button>
                        </li>

                    </ul>
                </div>
            </div>
            <!--report collapse end-->
</div>


    </div>
</div>
<!--off canvas end-->



</body>
</html>
